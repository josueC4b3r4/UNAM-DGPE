# Configuración de despliegue en Netlify.
#
# El sitio es estático: Netlify sólo ejecuta el build y sirve los archivos de
# dist/. No hay servidor, ni base de datos, ni formularios que envíen nada.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# ---------------------------------------------------------------------------
# Cabecera de no indexación, además de robots.txt y de la metaetiqueta.
#
# Son tres capas a propósito. Este prototipo lleva identidad de la UNAM y
# contenido ficticio sobre una dependencia real: si apareciera en resultados de
# búsqueda, alguien podría tomar por buenos unos requisitos y contactos que
# están inventados. X-Robots-Tag es la más difícil de saltarse porque viaja en
# la respuesta HTTP, no en el documento.
#
# Quitar las tres SÓLO si el proyecto deja de ser una maqueta.
# ---------------------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# La tipografía vive en public/, así que su nombre no lleva hash y el navegador
# no puede saber solo cuándo cambió. Se le pone caché larga porque el archivo es
# inmutable en la práctica; si algún día se cambia la fuente, hay que renombrarla.
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Los assets que genera Astro sí llevan hash en el nombre.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
